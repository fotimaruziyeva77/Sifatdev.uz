name: Build images

# Image'lar GitHub'da build qilinadi: production serverda xotira kam va boshqa saytlar ishlaydi.
# Repo Settings -> Secrets and variables -> Actions -> Variables: GA_ID, YM_ID (ixtiyoriy)
# Bu qiymatlar frontend'ga build vaqtida kiradi: o'zgartirilgach Actions'da "Run workflow" bilan qayta build qiling.
on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Turnstile Site Key ochiq qiymat (brauzerga baribir yuboriladi). Maxfiy kalit bu yerga yozilmaydi:
# u faqat serverdagi infra/backend.env faylida TURNSTILE_SECRET sifatida turadi.
env:
  TURNSTILE_SITE_KEY: 0x4AAAAAAF05sXcoVk5QUWIW

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/fotimaruziyeva77/sifatdev-${{ matrix.app }}:latest
            ghcr.io/fotimaruziyeva77/sifatdev-${{ matrix.app }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://sifatdev.uz
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ env.TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_GA_ID=${{ vars.GA_ID }}
            NEXT_PUBLIC_YM_ID=${{ vars.YM_ID }}
