# SIFATDEV — nginx (TLS terminatsiya, rate limit, statik kesh). TZ 9.4.
server_tokens off;

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=site:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name sifatdev.uz www.sifatdev.uz;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://sifatdev.uz$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.sifatdev.uz;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  return 301 https://sifatdev.uz$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name sifatdev.uz;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;

  client_max_body_size 11m;       # brif fayli ≤ 10 MB
  client_body_timeout 30s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  limit_conn conn 40;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
  gzip_min_length 1024;

  # Faqat kerakli HTTP metodlar
  if ($request_method !~ ^(GET|HEAD|POST|PATCH|DELETE|OPTIONS)$) { return 405; }

  # Yashirin fayllar (.env, .git) — hech qachon
  location ~ /\.(?!well-known) { deny all; return 404; }

  # --- API (backend) ---
  location = /api/v1/admin/auth/login {
    limit_req zone=login burst=3 nodelay;
    proxy_pass http://backend:4000;
    include /etc/nginx/conf.d/proxy_params.inc;
  }
  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend:4000;
    proxy_read_timeout 30s;
    proxy_request_buffering on;
    # Mijoz yuborgan ichki sarlavhalar o'chiriladi
    proxy_set_header X-Sifat-Rewritten "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  # --- Admin panel: ixtiyoriy IP cheklovi (ofis IP'lari) ---
  # location /admin { allow 203.0.113.10; deny all; proxy_pass http://frontend:3000; }

  # --- Next.js statik fayllari: uzoq kesh ---
  location /_next/static/ {
    proxy_pass http://frontend:3000;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  }

  location / {
    limit_req zone=site burst=60 nodelay;
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header X-Sifat-Rewritten "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
