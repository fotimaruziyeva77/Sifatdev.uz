# Serverdagi nginx uchun: /etc/nginx/sites-available/sifatdev.uz
# TLS blokini certbot qo'shadi:  certbot --nginx -d sifatdev.uz -d www.sifatdev.uz
# Zona nomlari boshqa saytlar bilan to'qnashmasligi uchun "sifatdev_" bilan boshlanadi.

limit_req_zone $binary_remote_addr zone=sifatdev_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sifatdev_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=sifatdev_site:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name www.sifatdev.uz;
    return 301 https://sifatdev.uz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name sifatdev.uz;

    client_max_body_size 11m;   # brif fayli 10 MB gacha
    client_body_timeout 30s;

    # Yashirin fayllar (.env, .git) hech qachon berilmaydi; .well-known bundan mustasno
    location ~ /\.(?!well-known) {
        return 404;
    }

    location = /api/v1/admin/auth/login {
        limit_req zone=sifatdev_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:4010;
        include /etc/nginx/snippets/sifatdev-proxy.conf;
    }

    location /api/ {
        limit_req zone=sifatdev_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4010;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/sifatdev-proxy.conf;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        include /etc/nginx/snippets/sifatdev-proxy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        limit_req zone=sifatdev_site burst=60 nodelay;
        proxy_pass http://127.0.0.1:3010;
        include /etc/nginx/snippets/sifatdev-proxy.conf;
    }
}
